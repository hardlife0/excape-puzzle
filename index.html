<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>화이트점 데스크퍼즐</title>
<meta name="description" content="2주에 한 번 바뀌는 2016 데스크퍼즐. 이번 문제를 풀면 2층 룸익스케이프 화이트점에서 비밀 할인을 받으실 수 있습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Gothic:wght@400;700&display=swap">
<style>
/* ===========================================================
   화이트점 데스크퍼즐 - 옛날 컴퓨터(90년대 데스크톱) 컨셉
   ⚠ 이 파일은 템플릿입니다. 아래 퍼즐 자리표시자에 build.py 가
     퍼즐 사진 아홉 장을 심어서 index.html 을 만듭니다.
     고칠 때는 이 파일을 고치고 python build.py 를 다시 돌리세요.
   =========================================================== */
:root{
  /* 벽지 - 낮 */
  --sky-1:#1F5FA8;
  --sky-2:#5E9FD6;
  --sky-3:#CFE4F6;
  --grass-1:#8AC53E;
  --grass-2:#487520;
  --cloud:rgba(255,255,255,.75);

  /* 창 크롬 */
  --face:#C6C6C6;
  --face-lit:#E8E8E8;
  --hi:#FFFFFF;
  --sh:#848484;
  --dsh:#0A0A0A;
  --field:#FFFFFF;
  --ink:#0A0A0A;
  --ink-dim:#575757;

  --title-a:#000082;
  --title-b:#1783D4;
  --title-ink:#FFFFFF;
  --title-off-a:#6E6E76;
  --title-off-b:#A6A6AE;
  --sel:#000082;
  --sel-ink:#FFFFFF;

  --err:#A80000;
  --ok:#00631F;

  --bevel-out:
    inset -1px -1px 0 0 var(--dsh), inset  1px  1px 0 0 var(--hi),
    inset -2px -2px 0 0 var(--sh),  inset  2px  2px 0 0 var(--face-lit);
  --bevel-in:
    inset  1px  1px 0 0 var(--dsh), inset -1px -1px 0 0 var(--hi),
    inset  2px  2px 0 0 var(--sh),  inset -2px -2px 0 0 var(--face-lit);
  --bevel-thin-in:
    inset 1px 1px 0 0 var(--sh), inset -1px -1px 0 0 var(--hi);
  --drop:0 8px 22px -8px rgba(0,0,0,.55);

  --ui:"Tahoma","Nanum Gothic","Malgun Gothic",Gulim,"굴림",sans-serif;
  --tty:"Courier New","Nanum Gothic Coding",monospace;
}
/* 벽지 - 밤 (창은 살짝만 낮춥니다) */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky-1:#0A1120; --sky-2:#17263F; --sky-3:#33507140;
    --grass-1:#24361A; --grass-2:#0D160A; --cloud:rgba(255,255,255,.10);
    --face:#B4B4B8; --face-lit:#D6D6DA; --sh:#76767C; --field:#EAEAE6;
    --title-a:#001352; --title-b:#0F5F9C;
    --drop:0 8px 26px -6px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --sky-1:#0A1120; --sky-2:#17263F; --sky-3:#33507140;
  --grass-1:#24361A; --grass-2:#0D160A; --cloud:rgba(255,255,255,.10);
  --face:#B4B4B8; --face-lit:#D6D6DA; --sh:#76767C; --field:#EAEAE6;
  --title-a:#001352; --title-b:#0F5F9C;
  --drop:0 8px 26px -6px rgba(0,0,0,.85);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--sky-2);
  color:var(--ink);
  font-family:var(--ui);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--sel);color:var(--sel-ink)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:1px dotted var(--ink);outline-offset:-4px}

/* ── 바탕화면 벽지 ── */
.wall{
  position:fixed;inset:0;z-index:-1;
  background-color:var(--sky-2);
  background-image:
    radial-gradient(165% 64% at 50% 143%, var(--grass-1) 0 71%, var(--grass-2) 71% 87.6%, transparent 87.8%),
    radial-gradient(closest-side at 24% 20%, var(--cloud), transparent),
    radial-gradient(closest-side at 76% 11%, var(--cloud), transparent),
    linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 52%, var(--sky-3) 100%);
  background-size:100% 100%, 48% 26%, 32% 18%, 100% 100%;
  background-repeat:no-repeat;
  background-attachment:fixed;
}

/* ── 배치 ── */
.desk{
  max-width:600px;margin:0 auto;
  padding:16px 12px calc(58px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;
}

/* ── 창 ── */
.win{
  background:var(--face);
  box-shadow:var(--bevel-out), var(--drop);
  padding:3px;
  display:flex;flex-direction:column;
}
.tbar{
  background:linear-gradient(90deg,var(--title-a),var(--title-b));
  color:var(--title-ink);
  display:flex;align-items:center;gap:6px;
  padding:3px 3px 3px 4px;
  font-size:12px;font-weight:700;
}
.win.done .tbar{background:linear-gradient(90deg,var(--title-off-a),var(--title-off-b))}
.tbar .tname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtns{display:flex;gap:2px;flex:none}
.tbtn{
  width:18px;height:16px;background:var(--face);box-shadow:var(--bevel-out);
  display:grid;place-items:center;
  font-size:10px;font-weight:700;color:var(--ink);line-height:1;font-family:var(--ui);
}
.menubar{display:flex;gap:2px;padding:2px 1px;font-size:12px;color:var(--ink)}
.menubar > span{padding:1px 6px}
.menubar > span:first-letter{text-decoration:underline}
.mbtn{
  margin-left:auto;background:none;border:0;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 7px;font-size:12px;color:var(--ink);font-family:var(--ui);
}
.mbtn:hover,.mbtn[aria-expanded="true"]{background:var(--sel);color:var(--sel-ink)}

/* 메모장 본문 */
.page{
  background:var(--field);box-shadow:var(--bevel-in);
  margin:3px 0 0;padding:12px 12px 14px;
  font-family:var(--tty);
  display:flex;flex-direction:column;gap:11px;
  overflow-x:auto;
}
.path{
  font-size:12px;color:var(--ink-dim);
  border-bottom:1px solid #D6D6D6;padding-bottom:8px;white-space:nowrap;
}
h1{
  font-family:var(--tty);font-weight:700;
  font-size:clamp(19px,5.6vw,23px);line-height:1.35;
  margin:0;text-wrap:balance;letter-spacing:-.01em;
}
.dek{margin:0;font-size:14px;color:var(--ink-dim)}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:14px}
.rules li{display:grid;grid-template-columns:20px 1fr;gap:6px}
.rules b{font-weight:700}

/* 회차 정보판 */
.term{
  background:rgba(0,0,0,.045);box-shadow:var(--bevel-thin-in);
  padding:9px 10px;display:flex;flex-direction:column;gap:5px;
}
.term-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.5px}
.term-row dt{color:var(--ink-dim)}
.term-row dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.term-row dd.hot{color:var(--err)}
.preview{
  background:#FFF6D6;box-shadow:var(--bevel-thin-in);
  padding:6px 9px;font-size:12.5px;font-weight:700;color:#7A5A00;
}

/* ── 퍼즐 창 ── */
.puzbody{padding:6px 4px 4px;display:flex;flex-direction:column;gap:9px}
.shot{background:#FFFFFF;box-shadow:var(--bevel-in);padding:4px}
.shot img{display:block;width:100%;height:auto}
.answer{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.alab{font-size:12.5px;color:var(--ink);flex:1 1 100%;line-height:1.45}
.tin{
  background:var(--field);box-shadow:var(--bevel-in);border:0;
  padding:7px 9px;width:132px;
  font-family:var(--tty);font-size:19px;font-weight:700;letter-spacing:.1em;
  color:var(--ink);
}
.tin:disabled{color:var(--ok);opacity:1;-webkit-text-fill-color:var(--ok)}
.btn{
  background:var(--face);box-shadow:var(--bevel-out);
  border:0;padding:6px 14px;min-height:30px;
  font-size:12.5px;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.btn:active{box-shadow:var(--bevel-in);padding:7px 13px 5px 15px}
.btn:disabled{color:var(--sh);cursor:default;box-shadow:var(--bevel-out)}
.btn:disabled:active{box-shadow:var(--bevel-out);padding:6px 14px}

.panel{
  box-shadow:var(--bevel-thin-in);padding:3px 7px;
  font-size:12px;color:var(--ink);min-height:22px;
  display:flex;align-items:center;gap:6px;
}
.panel.grow{flex:1;min-width:120px}
.panel.bad{color:var(--err);font-weight:700}
.panel.good{color:var(--ok);font-weight:700}
.dot{width:11px;height:11px;flex:none;border:1px solid var(--dsh);border-radius:50%}
.panel.bad .dot{background:var(--err)}
.panel.good .dot{background:var(--ok)}
.panel:not(.bad):not(.good) .dot{display:none}
.winfoot{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:4px 0 1px}

@keyframes rattle{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-6px)} 30%{transform:translateX(5px)}
  45%{transform:translateX(-4px)} 60%{transform:translateX(3px)} 80%{transform:translateX(-1px)}
}
.shake{animation:rattle .4s ease}

/* ── 해제 창 ── */
@keyframes pop{from{transform:scale(.965);opacity:0}to{transform:none;opacity:1}}
#winCleared:not([hidden]){animation:pop .18s ease-out}
.dlgbody{padding:14px 12px 10px;display:flex;flex-direction:column;gap:14px}
.okrow{display:flex;gap:12px;align-items:center}
.okrow h1{font-size:clamp(18px,5.2vw,22px)}
.instruct{
  background:var(--field);box-shadow:var(--bevel-in);
  padding:12px;display:flex;flex-direction:column;gap:7px;
}
.instruct p{margin:0;font-size:14.5px;line-height:1.65}
.instruct .small{font-size:13px;color:var(--ink-dim)}
.live{display:flex;flex-direction:column;gap:5px}
.live-label{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim)}
.live-clock{
  background:var(--field);box-shadow:var(--bevel-in);padding:9px 11px;
  font-family:var(--tty);font-weight:700;
  font-size:clamp(15px,4.4vw,19px);font-variant-numeric:tabular-nums;
}
.live-note{margin:0;font-size:12.5px;color:var(--ink-dim)}

/* ── 작업 표시줄 ── */
.taskbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--face);
  box-shadow:inset 0 1px 0 0 var(--hi), inset 0 2px 0 0 var(--face-lit);
  display:flex;align-items:center;gap:4px;
  padding:3px 4px calc(3px + env(safe-area-inset-bottom));
}
.start{display:flex;align-items:center;gap:5px;font-weight:700;font-size:12.5px;padding:4px 9px;flex:none}
.sep{width:2px;align-self:stretch;margin:1px 2px;box-shadow:var(--bevel-thin-in)}
.tasks{display:flex;gap:3px;flex:1;min-width:0;overflow:hidden}
.task{
  flex:1 1 0;min-width:0;max-width:190px;text-align:left;
  font-size:12px;padding:4px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.task[aria-pressed="true"]{box-shadow:var(--bevel-in)}
.tray{flex:none;display:flex;align-items:center;gap:6px;box-shadow:var(--bevel-thin-in);padding:3px 7px 3px 5px}
.langbtn{
  background:var(--face);border:0;box-shadow:var(--bevel-out);
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  padding:3px 8px;min-height:22px;font-size:11.5px;cursor:pointer;color:var(--ink);
}
.langbtn:active,.langbtn[aria-expanded="true"]{box-shadow:var(--bevel-in)}
@media (max-width:439px){.langbtn .lbl{display:none}}
.trayclock{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── 메뉴 ── */
.startmenu{
  position:fixed;left:4px;bottom:calc(40px + env(safe-area-inset-bottom));z-index:60;
  width:230px;background:var(--face);box-shadow:var(--bevel-out), var(--drop);
  padding:3px;display:flex;
}
.smband{
  width:22px;flex:none;
  background:linear-gradient(180deg,var(--title-b),var(--title-a));
  color:var(--title-ink);font-size:11px;font-weight:700;letter-spacing:.14em;
  writing-mode:vertical-rl;transform:rotate(180deg);
  display:flex;align-items:flex-end;justify-content:center;padding:8px 0;
}
.smlist{flex:1;display:flex;flex-direction:column;min-width:0}
.smitem{
  background:none;border:0;text-align:left;cursor:pointer;
  padding:9px 10px;font-size:13px;display:flex;align-items:center;gap:8px;
}
.smitem:hover,.smitem:focus-visible{background:var(--sel);color:var(--sel-ink)}
.smitem .k{
  width:16px;height:16px;flex:none;box-shadow:var(--bevel-out);background:var(--face);
  display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--ink);
}
.smrule{height:2px;margin:3px 6px;box-shadow:var(--bevel-thin-in)}
.popmenu{
  position:fixed;z-index:70;min-width:158px;
  background:var(--face);box-shadow:var(--bevel-out), var(--drop);
  padding:3px;display:flex;flex-direction:column;
}
.popmenu .smitem{padding:10px 12px;font-size:13.5px}
.popmenu .mark{width:13px;flex:none;font-size:10px;text-align:center;line-height:1}

.credit{font-size:11.5px;color:#FFFFFF;text-align:center;text-shadow:1px 1px 1px rgba(0,0,0,.8)}

[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="desk">

  <!-- 안내 -->
  <section class="win" id="winIntro">
    <div class="tbar">
      <svg width="14" height="14" viewBox="0 0 32 32" aria-hidden="true">

const $ = (id) => document.getElementById(id);

const GLOBE =
  '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true">' +
  '<circle cx="8" cy="8" r="6.3" fill="#1783D4" stroke="#0A0A0A" stroke-width="1.4"></circle>' +

/* ── 언어 ── */
function pickLang() {
  try {
    const saved = localStorage.getItem("whiteLockLang");
    if (saved === "ko" || saved === "en") return saved;
  } catch (e) { /* 시크릿 모드 등 */ }
  return /^ko/i.test(navigator.language || "") ? CONFIG.DEFAULT_LANG : "en";
}
let lang = pickLang();
const t = () => T[lang];

/* ── 회차 계산 (한국 시간 기준) ──────────────────────────────
   START 한국시간 자정을 0으로 두고, WEEKS 주마다 1회차씩 넘어갑니다. */
const KST = 9 * 3600e3;
const PERIOD = CONFIG.WEEKS * 7 * 24 * 3600e3;
const EPOCH = Date.UTC(CONFIG.START[0], CONFIG.START[1] - 1, CONFIG.START[2]) - KST;

function roundNo(at) {              // 0, 1, 2 ... (기준일 전이면 음수)
  return Math.floor(((at === undefined ? Date.now() : at) - EPOCH) / PERIOD);
}
function roundStart(r) { return EPOCH + r * PERIOD; }
function kstDate(ms) {              // 한국 시간의 연/월/일
  const d = new Date(ms + KST);
  return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate() };
}
function fmtDate(ms) {
  const p = kstDate(ms);
  return lang === "ko"
    ? p.y + "." + two(p.m) + "." + two(p.d)
    : MON_EN[p.m - 1] + " " + p.d;
}

const N = CONFIG.ROTATION.length;
const round = roundNo();
const slot = ((round % N) + N) % N;

/* 미리보기 지정이 있으면 그것을 대신 보여줍니다 */
function previewId() {
  const m = (location.hash || "").match(/^#p=([a-z]|\d+)$/i);
  if (!m) return null;
  const v = m[1].toLowerCase();
  if (/^\d+$/.test(v)) {
    const i = parseInt(v, 10) - 1;
    return CONFIG.ROTATION[i] || null;
  }
  return CONFIG.ROTATION.indexOf(v) >= 0 ? v : null;
}
const preview = previewId();
const activeId = preview || CONFIG.ROTATION[slot];

/* ── 이번 회차를 풀었는지 (회차가 넘어가면 자동으로 초기화) ── */
const SAVE_KEY = "whiteDeskPuzzle:v2";
let done = false;
if (!preview) {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if (raw && raw.r === round && raw.id === activeId) done = true;
  } catch (e) { /* 무시 */ }
}
function save() {
  if (preview) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ r: round, id: activeId }));
  } catch (e) { /* 무시 */ }
}

let revealed = false;

/* ── 채점 ── */
const norm = (v) => (v || "").toUpperCase().replace(/[^0-9A-Z]/g, "");

async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

function setPanel(el, text, kind) {
  el.querySelector(".sttext").textContent = text;
  el.classList.toggle("bad", kind === "bad");
  el.classList.toggle("good", kind === "good");
}

async function grade(p, quiet) {
  const win = $("p-" + p.id);
  const input = win.querySelector(".tin");
  const panel = win.querySelector(".st");
  const value = norm(input.value);
  if (!value) { setPanel(panel, t().idle, ""); return; }

  const hash = await sha256(CONFIG.SALT + value);
  if (hash === p.hash) {
    done = true;
    save();
    markDone(p);
    if (!revealed) reveal();
  } else if (!quiet) {
    setPanel(panel, t().wrong, "bad");
    win.classList.add("shake");
    setTimeout(() => win.classList.remove("shake"), 420);
  }
}

function markDone(p) {
  const win = $("p-" + p.id);
  const input = win.querySelector(".tin");
  win.classList.add("done");
  input.disabled = true;
  win.querySelector(".ok").disabled = true;
  setPanel(win.querySelector(".st"), t().right + " \u2014 " + t().doneTag, "good");
}

/* ── 화면 그리기 ── */
function render() {
  const s = t();
  document.documentElement.lang = lang;

  $("tbIntro").textContent = s.tbIntro;
  $("tbCleared").textContent = s.tbCleared;
  $("path").textContent = s.path;
  $("title").textContent = s.title;
  $("dek").textContent = s.dek;

  const mb = $("menubar");
  mb.innerHTML = "";
  s.menubar.forEach((m) => {
    const sp = document.createElement("span");
    sp.setAttribute("aria-hidden", "true");
    sp.textContent = m;
    mb.appendChild(sp);
  });
  const lb = document.createElement("button");
  lb.type = "button";
  lb.className = "mbtn";
  lb.setAttribute("aria-haspopup", "true");
  lb.setAttribute("aria-expanded", "false");
  lb.setAttribute("aria-controls", "langMenu");
  lb.innerHTML = GLOBE + "<span>언어 / Language</span>";
  lb.addEventListener("click", (e) => { e.stopPropagation(); toggleLangMenu(lb); });
  mb.appendChild(lb);

  const rules = $("rules");
  rules.innerHTML = "";
  s.rules.forEach((r, i) => {
    const li = document.createElement("li");
    li.innerHTML = "<span>" + (i + 1) + ")</span><span>" + r + "</span>";
    rules.appendChild(li);
  });

  PUZZLES.forEach((p) => {
    const win = $("p-" + p.id);
    const on = p.id === activeId;
    win.hidden = !on;
    if (!on) return;                       /* 이번 회차 문제 하나만 그립니다 */
    const c = s.puz[p.id];
    win.querySelector(".tname").textContent = c.name;
    win.querySelector(".alab").textContent = c.ask;
    win.querySelector("img").alt = c.alt;
    const input = win.querySelector(".tin");
    input.placeholder = s.placeholder;
    input.setAttribute("aria-label", c.name + " \u2014 " + c.ask);
    win.querySelector(".ok").textContent = s.solve;
    if (done) markDone(p);
    else setPanel(win.querySelector(".st"), s.idle, "");
  });

  const tag = $("previewTag");
  tag.hidden = !preview;
  if (preview) tag.textContent = s.previewTag(s.puz[activeId].name);

  $("clearedTitle").textContent = s.clearedTitle;
  $("msgWhere").innerHTML = s.where;
  $("msgWhat").innerHTML = s.what;
  $("msgSmall").textContent = s.small;
  $("liveLabel").textContent = s.liveLabel;
  $("liveNote").textContent = s.liveNote;
  $("footBrand").textContent = s.footBrand;
  $("footNote").textContent = s.footNote;
  $("startLabel").textContent = s.startLabel;
  $("langNow").textContent = LANG_NAMES[lang];
  $("langBtnTray").setAttribute("aria-label",
    lang === "ko" ? "언어 선택 - 지금은 한국어" : "Choose language - currently English");

  buildLangMenu();
  buildStartMenu();
  refresh();
  tick();
}

function refresh() {
  const s = t();
  const from = roundStart(round);
  const until = roundStart(round + 1);
  const left = Math.max(0, Math.ceil((until - Date.now()) / 86400e3));

  const rows = [
    [s.termRound, s.termRoundV(slot + 1, N), false],
    [s.termSpan, s.dateSpan(fmtDate(from), fmtDate(until - 86400e3)), false],
    [s.termNext, s.dday(left), left <= 2]
  ];
  const el = $("term");
  el.innerHTML = "";
  rows.forEach(([k, v, hot]) => {
    const row = document.createElement("div");
    row.className = "term-row";
    row.innerHTML = "<dt></dt><dd" + (hot ? ' class="hot"' : "") + "></dd>";
    row.firstChild.textContent = k;
    row.lastChild.textContent = v;
    el.appendChild(row);
  });
  buildTasks();
}

function buildTasks() {
  const s = t();
  const list = [["winIntro", s.taskIntro]];
  if (revealed) list.push(["winCleared", s.taskCleared]);
  const el = $("tasks");
  el.innerHTML = "";
  list.forEach(([id, name], i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn task";
    b.textContent = name;
    b.setAttribute("aria-pressed", String(i === list.length - 1));
    b.addEventListener("click", () => $(id).scrollIntoView({ behavior: "smooth", block: "center" }));
    el.appendChild(b);
  });
}

function reveal() {
  revealed = true;
  $("winCleared").hidden = false;
  buildTasks();
  $("winCleared").scrollIntoView({ behavior: "smooth", block: "center" });
}

function buildStartMenu() {
  const s = t();
  const items = [
    ["A", LANG_NAMES[lang === "ko" ? "en" : "ko"], () => { closeStart(); setLang(lang === "ko" ? "en" : "ko"); }],
    ["\u21BA", s.menuReset, () => { closeStart(); resetAll(); }]
  ];
  const el = $("smList");
  el.innerHTML = "";
  items.forEach(([glyph, label, fn], i) => {
    if (i === items.length - 1) {
      const r = document.createElement("div");
      r.className = "smrule";
      el.appendChild(r);
    }
    const b = document.createElement("button");
    b.type = "button";
    b.className = "smitem";
    b.innerHTML = '<span class="k" aria-hidden="true">' + glyph + "</span><span></span>";
    b.lastChild.textContent = label;
    b.addEventListener("click", fn);
    el.appendChild(b);
  });
}
function openStart() {
  closeLangMenu();
  $("startMenu").hidden = false;
  $("startBtn").setAttribute("aria-expanded", "true");
}
function closeStart() {
  $("startMenu").hidden = true;
  $("startBtn").setAttribute("aria-expanded", "false");
}

  e.stopPropagation();

  done = false;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 무시 */ }
  revealed = false;
  $("winCleared").hidden = true;
  PUZZLES.forEach((p) => {
    const win = $("p-" + p.id);
    win.classList.remove("done");
    const input = win.querySelector(".tin");
    input.disabled = false;
    input.value = "";
    win.querySelector(".ok").disabled = false;
  });
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ── 언어 메뉴 ── */
let langAnchor = null;
function buildLangMenu() {
  const el = $("langMenu");
  el.innerHTML = "";
  Object.keys(LANG_NAMES).forEach((code) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "smitem";
    b.setAttribute("role", "menuitemradio");
    b.setAttribute("aria-checked", String(code === lang));
    b.innerHTML = '<span class="mark" aria-hidden="true">' + (code === lang ? "\u25CF" : "") + "</span><span></span>";
    b.lastChild.textContent = LANG_NAMES[code];
    b.addEventListener("click", () => { closeLangMenu(); setLang(code); });
    el.appendChild(b);
  });
}
function openLangMenu(anchor) {
  closeStart();
  const m = $("langMenu");
  m.hidden = false;
  const r = anchor.getBoundingClientRect();
  const w = m.offsetWidth, h = m.offsetHeight;
  const left = Math.max(6, Math.min(r.left, window.innerWidth - w - 6));
  let top = r.bottom + 2;
  if (top + h > window.innerHeight - 6) top = Math.max(6, r.top - h - 2);
  m.style.left = left + "px";
  m.style.top = top + "px";
  anchor.setAttribute("aria-expanded", "true");
  langAnchor = anchor;
}
function closeLangMenu() {
  $("langMenu").hidden = true;
  if (langAnchor) langAnchor.setAttribute("aria-expanded", "false");
  langAnchor = null;
}
function toggleLangMenu(anchor) {
  if ($("langMenu").hidden || langAnchor !== anchor) openLangMenu(anchor);
  else closeLangMenu();
}
function setLang(next) {
  if (next === lang) return;
  lang = next;
  try { localStorage.setItem("whiteLockLang", lang); } catch (e) { /* 무시 */ }
  render();
}
$("langBtnTray").addEventListener("click", (e) => {
  e.stopPropagation();
  toggleLangMenu($("langBtnTray"));
});
window.addEventListener("scroll", () => { if (!$("langMenu").hidden) closeLangMenu(); }, { passive: true });
window.addEventListener("resize", closeLangMenu);

document.addEventListener("click", (e) => {
  if (!$("startMenu").hidden && !e.target.closest("#startMenu")) closeStart();
  if (!$("langMenu").hidden && !e.target.closest("#langMenu")) closeLangMenu();
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!$("startMenu").hidden) { closeStart(); $("startBtn").focus(); }
  if (!$("langMenu").hidden) { const a = langAnchor; closeLangMenu(); if (a) a.focus(); }
});

/* ── 각 퍼즐 칸에 손 달기 ── */
PUZZLES.filter((p) => p.id === activeId).forEach((p) => {
  const win = $("p-" + p.id);
  const input = win.querySelector(".tin");
  const btn = win.querySelector(".ok");
  input.addEventListener("input", () => {
    const panel = win.querySelector(".st");
    if (panel.classList.contains("bad")) setPanel(panel, t().idle, "");
    if (norm(input.value).length === p.len) grade(p, true);   // 자리를 다 채우면 조용히 확인
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); grade(p, false); }
  });
  btn.addEventListener("click", () => grade(p, false));
});

/* ── 시계 - 캡처본과 구분됩니다 ── */
const DAYS_KO = ["일","월","화","수","목","금","토"];
const DAYS_EN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const two = (n) => String(n).padStart(2, "0");

function tick() {
  const d = new Date();
  const h12 = d.getHours() % 12 === 0 ? 12 : d.getHours() % 12;
  const time = h12 + ":" + two(d.getMinutes()) + ":" + two(d.getSeconds());
  const am = d.getHours() < 12;

  $("trayClock").textContent = lang === "ko"
    ? (am ? "오전 " : "오후 ") + h12 + ":" + two(d.getMinutes())
    : h12 + ":" + two(d.getMinutes()) + " " + (am ? "AM" : "PM");

  $("clock").textContent = lang === "ko"
    ? d.getFullYear() + "." + two(d.getMonth() + 1) + "." + two(d.getDate()) +
      " (" + DAYS_KO[d.getDay()] + ")  " + (am ? "오전 " : "오후 ") + time
    : MON_EN[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear() +
      " (" + DAYS_EN[d.getDay()] + ")  " + time + " " + (am ? "AM" : "PM");
}
setInterval(tick, 1000);

/* ── 해시 생성기: 주소 뒤에 #hash=새정답 ── */
async function hashTool() {
  const m = location.hash.match(/^#hash=(.+)$/);
  if (!m) { $("tool").hidden = true; return; }
  const val = norm(decodeURIComponent(m[1]));
  $("tool").hidden = false;
  $("toolIn").textContent = '정답 "' + val + '" 의 해시:';
  $("toolOut").textContent = await sha256(CONFIG.SALT + val);
}

render();
if (done) { revealed = true; $("winCleared").hidden = false; buildTasks(); }
hashTool();
window.addEventListener("hashchange", hashTool);
/* 미리보기 주소를 바꾸면 그 문제로 다시 그립니다 */
window.addEventListener("hashchange", () => {
  if (/^#p=/i.test(location.hash) || location.hash === "") location.reload();
});
